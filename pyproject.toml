[project]
name = "book-watcher"
version = "0.1.0"
description = "Read an EPUB aloud in the browser, one subtitle-style sentence at a time (Mandarin + English)"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "edge-tts>=7.2.8",
    "lxml>=6.1.3",
]

[project.scripts]
book-watcher = "book_watcher.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
